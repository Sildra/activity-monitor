[build-system]
requires = [
    "hatchling",
    "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
name = "activity-monitor"
dynamic = ["version"]
authors = [
    { name="Thibaut Fresnet", email="sildra.fr@gmail.com" },
]
description = "Self-hosted activity monitor: timeline of where your attention goes across sources"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "aiosqlite",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "openapi-typescript",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "allure-pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--alluredir=allure-results --clean-alluredir"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
ignore = ["DTZ001", "DTZ005", "DTZ006", "DTZ007"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[project.scripts]
activity-monitor = "activity_monitor.main:main"
activity-monitor-windows = "activity_monitor.windows_watcher:main"

[project.urls]
Homepage = "https://github.com/Sildra/ActivityMonitor"
Issues = "https://github.com/Sildra/ActivityMonitor/issues"

[tool.hatch.build.hooks.vcs]
version-file = "activity_monitor/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["activity_monitor"]
artifacts = ["activity_monitor/frontend/dist"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "activity_monitor/frontend/dist"

[tool.hatch.build.targets.sdist]
artifacts = ["frontend/dist"]
exclude = ["supervisor.py"]

[tool.hatch.version]
source = "vcs"
